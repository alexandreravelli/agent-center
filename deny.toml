# cargo-deny: checks the dependency graph (https://embarkstudios.github.io/cargo-deny/).
# Run `cargo deny check` locally; CI runs it on every push.

[graph]
all-features = true

[advisories]
# Vulnerable, unmaintained and yanked crates fail the check. To accept one, add its id to
# `ignore` with the reason.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses only, all compatible with Agent Center's MIT license.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0"]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
