[[app]]
id = "hermes-desktop"
name = "Hermes Desktop"
category = "apps"
summary = "The desktop chat app for Hermes Agent, built on this computer."
homepage = "https://hermes-agent.nousresearch.com/docs/user-guide/desktop"
logo = "hermes"
icon = "hermes"
color = "#7c3aed"
badge = "H"
scope = "user"
method = "built locally by Hermes Agent"
requires = ["hermes-agent", "nodejs"]
version = '''
[ -f "${HERMES_HOME:-$HOME/.hermes}/desktop-build-stamp.json" ] && "$HOME/.local/bin/hermes" --version
'''
latest = "pypi:hermes-agent"
install = '"$HOME/.local/bin/hermes" desktop --build-only'
update = '"$HOME/.local/bin/hermes" update'
remove = '"$HOME/.local/bin/hermes" uninstall --gui --yes'
notes = """
Nous Research does not publish a Linux package: `hermes desktop --build-only` builds the \
Electron app from the Hermes Agent sources (a few minutes, needs Node.js). Start it once with \
`hermes desktop --skip-build`: that adds Hermes to the applications menu. `hermes update` \
updates the agent and rebuilds the app. Removing it keeps the agent, your config and chats."""

