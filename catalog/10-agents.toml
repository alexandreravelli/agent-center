[[app]]
id = "cursor-cli"
name = "Cursor CLI"
category = "agents"
summary = "Cursor's coding agent for the terminal."
homepage = "https://cursor.com/docs/cli/installation"
logo = "cursor"
color = "#0f0f0f"
badge = "Cu"
scope = "user"
method = "Cursor install script, in ~/.local/share/cursor-agent"
command = "agent"
version = 'test -x "$HOME/.local/bin/cursor-agent" && "$HOME/.local/bin/cursor-agent" --version'
latest = "cmd:curl -fsSL https://cursor.com/install | grep -o 'downloads.cursor.com/lab/[^/]*' | head -n 1"
install = "run_installer https://cursor.com/install"
update = '"$HOME/.local/bin/cursor-agent" update'
remove = '''
bin="$HOME/.local/bin/cursor-agent"
if [ "${AC_PURGE:-0}" = 1 ] && [ -x "$bin" ]; then
    timeout 60 "$bin" logout </dev/null || true
fi
# The install script links both commands to its versions directory; leave other `agent` commands alone.
for link in "$HOME/.local/bin/agent" "$bin"; do
    case $(readlink "$link" 2>/dev/null) in
        "$HOME"/.local/share/cursor-agent/*) rm -f "$link" ;;
    esac
done
rm -rf "$HOME/.local/share/cursor-agent"
'''
purge = ["~/.cursor/cli-config.json"]
notes = """
The command is `agent` (also `cursor-agent`), in ~/.local/bin: log out and back in if your \
terminal does not find it. Sign in with `agent login`, or set CURSOR_API_KEY. The CLI updates \
itself. Cursor documents no uninstall command, so Agent Center deletes what the install script \
created. ~/.cursor also holds the Cursor editor's settings, so only the CLI's cli-config.json is \
deleted with the settings."""

[[app]]
id = "opencode"
name = "OpenCode"
category = "agents"
summary = "Open-source coding agent for the terminal, works with many model providers."
homepage = "https://opencode.ai/docs/"
color = "#211e1e"
badge = "oc"
scope = "user"
method = "OpenCode install script, in ~/.opencode"
command = "opencode"
version = 'test -x "$HOME/.opencode/bin/opencode" && "$HOME/.opencode/bin/opencode" --version'
latest = "npm:opencode-ai"
install = "run_installer https://opencode.ai/install"
update = '"$HOME/.opencode/bin/opencode" upgrade'
remove = '''
oc="$HOME/.opencode/bin/opencode"
if [ -x "$oc" ] && [ "${AC_PURGE:-0}" = 1 ]; then
    "$oc" uninstall --force
elif [ -x "$oc" ]; then
    "$oc" uninstall --force --keep-config --keep-data
fi
rm -rf "$HOME/.opencode"
'''
purge = ["~/.config/opencode", "~/.local/share/opencode", "~/.cache/opencode"]
notes = """
Installed for your user in ~/.opencode/bin (the installer adds it to PATH in your shell \
profile). OpenCode updates itself at startup; `opencode uninstall` removes it."""

