# AI coding agents for the terminal.
#
# Each recipe follows the vendor's documented method. Scripts run with `sh` (dash) after the
# helper functions shown by `agent-center info <app>`; `scope = "system"` scripts run as root.

[[app]]
id = "claude-code"
name = "Claude Code"
category = "agents"
featured = true
summary = "Anthropic's agentic coding tool: reads your code, edits files and runs commands."
homepage = "https://code.claude.com/docs/en/setup"
logo = "claude"
color = "#d97757"
badge = "Cl"
scope = "system"
method = "Anthropic APT repository (stable channel)"
command = "claude"
version = "deb_version claude-code"
latest = "cmd:repo_version https://downloads.claude.ai/claude-code/apt/stable/dists/stable/main/binary-amd64 claude-code"
install = '''
apt_key https://downloads.claude.ai/keys/claude-code.asc /etc/apt/keyrings/claude-code.asc
echo "deb [signed-by=/etc/apt/keyrings/claude-code.asc] https://downloads.claude.ai/claude-code/apt/stable stable main" \
    > /etc/apt/sources.list.d/claude-code.list
apt_install claude-code
'''
update = "apt_upgrade claude-code"
remove = '''
apt_purge claude-code
drop /etc/apt/sources.list.d/claude-code.list /etc/apt/keyrings/claude-code.asc
'''
purge = ["~/.claude", "~/.claude.json"]
notes = """
Installed for all users from Anthropic's signed APT repository (key fingerprint \
31DDDE24DDFAB679F42D7BD2BAA929FF1A7ECACE). The stable channel is about a week behind the latest \
release and skips releases with major regressions. Package installs do not update themselves: \
Agent Center (or apt upgrade) updates them. If you also used the native installer, remove \
~/.local/bin/claude and ~/.local/share/claude so only one copy remains."""

