[[app]]
id = "openclaw"
name = "OpenClaw"
category = "agents"
summary = "Personal AI assistant that runs on your machine, with a gateway service."
homepage = "https://docs.openclaw.ai/install"
color = "#e8492f"
badge = "Cw"
scope = "system"
method = "npm package openclaw"
command = "openclaw"
requires = ["nodejs"]
version = "npm_version openclaw"
latest = "npm:openclaw"
install = '''
node -e 'const [a,b]=process.versions.node.split(".").map(Number); process.exit(a>24||(a===24&&b>=16)?0:1)' \
    || die "OpenClaw needs Node.js 24.16 or newer: update Node.js first."
npm_global openclaw@latest --allow-scripts=openclaw
'''
remove_user = '''
if have openclaw; then
    if [ "${AC_PURGE:-0}" = 1 ]; then
        openclaw uninstall --all --yes --non-interactive
    else
        openclaw uninstall --service --yes --non-interactive
    fi
fi
'''
remove = "npm_remove openclaw"
purge = ["~/.openclaw"]
notes = """
After installing, run `openclaw onboard --install-daemon` in a terminal to set it up and start \
its gateway (a systemd user service). Removing it first stops that service with \
`openclaw uninstall`."""

[[app]]
id = "hermes-agent"
name = "Hermes Agent"
category = "agents"
summary = "Nous Research's self-improving AI agent, with a gateway for chat apps."
homepage = "https://hermes-agent.nousresearch.com/docs/getting-started/installation"
logo = "hermes"
color = "#7c3aed"
badge = "H"
scope = "user"
method = "Hermes install script, in ~/.hermes"
command = "hermes"
version = 'test -x "$HOME/.local/bin/hermes" && "$HOME/.local/bin/hermes" --version'
latest = "pypi:hermes-agent"
install = "run_installer https://hermes-agent.nousresearch.com/install.sh --non-interactive"
update = '"$HOME/.local/bin/hermes" update'
remove = '''
if [ "${AC_PURGE:-0}" = 1 ]; then
    "$HOME/.local/bin/hermes" uninstall --yes --full
else
    "$HOME/.local/bin/hermes" uninstall --yes
fi
'''
purge = ["~/.hermes"]
notes = """
Installs its own uv and Python. Run `hermes setup` (or just `hermes`) to configure a model. \
Removal uses `hermes uninstall`, which also stops the gateway service."""

[[app]]
id = "deepseek-harness"
name = "DeepSeek Harness"
category = "agents"
summary = "DeepSeek's open-source agent harness (`dsh`), with a Web UI. Developer preview."
homepage = "https://github.com/deepseek-ai/deepseek-harness"
color = "#4d6bfe"
badge = "DS"
scope = "system"
method = "npm package @deepseek-ai/dsh"
command = "dsh web"
requires = ["nodejs"]
version = "npm_version @deepseek-ai/dsh"
latest = "npm:@deepseek-ai/dsh"
install = '''
node -e 'const [a,b]=process.versions.node.split(".").map(Number); process.exit(a>=24||(a===22&&b>=19)?0:1)' \
    || die "DeepSeek Harness needs Node.js 22.19 or newer: update Node.js first."
npm_global @deepseek-ai/dsh@latest
'''
remove = "npm_remove @deepseek-ai/dsh"
purge = ["~/.dsh"]
notes = """
Developer preview: DeepSeek warns that new versions will break compatibility; read its safety \
notice (SAFETY.md in the repository) first. Run `dsh web` in a project folder to open the Web UI \
at http://127.0.0.1:3080, then add a DeepSeek API key in Settings > Models. Settings, keys and \
sessions are kept in ~/.dsh. DeepSeek publishes no Linux desktop app."""
