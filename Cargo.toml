[package]
name = "agent-center"
version = "0.4.0"
edition = "2024"
rust-version = "1.92"
description = "A lightweight app center that cleanly installs, updates and removes AI coding tools, browsers and editors on Debian"
license = "MIT"
readme = "README.md"
repository = "https://github.com/alexandreravelli/agent-center"
homepage = "https://github.com/alexandreravelli/agent-center"
keywords = ["app-center", "installer", "debian", "ai", "xfce"]
categories = ["command-line-utilities", "gui"]
# Distributed as a Debian package with its APT repository: it needs its catalog, logos and
# password helper in /usr, which `cargo install` cannot provide.
publish = false

[features]
default = ["gui"]
# The GTK 3 window (GTK 3 is already present on XFCE desktops). Without it, only the CLI is built.
gui = ["dep:gtk", "dep:async-channel"]

[dependencies]
anyhow = "1"
async-channel = { version = "2", optional = true }
gtk = { version = "0.19", optional = true, features = ["v3_24"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# x, y, w, h, r, g, b are the clearest names in drawing code.
many_single_char_names = "allow"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"

[package.metadata.deb]
maintainer = "alexandreravelli"
section = "admin"
priority = "optional"
depends = "$auto, curl, ca-certificates, sudo | pkexec, librsvg2-common"
recommends = "xz-utils, bzip2, gpg"
maintainer-scripts = "debian/"
extended-description = """\
Agent Center is a small app center for Debian desktops. It installs, updates and \
removes AI coding agents (Claude Code, Codex, OpenCode, Pi, Gemini CLI...), AI \
desktop apps, browsers and code editors, each with the method documented by its \
vendor. Every recipe is a readable shell script in a TOML catalog, shown before \
it runs. Includes a GTK 3 window and a command-line interface."""
assets = [
    ["target/release/agent-center", "usr/bin/", "755"],
    ["data/askpass", "usr/lib/agent-center/askpass", "755"],
    ["catalog/*.toml", "usr/share/agent-center/catalog/", "644"],
    ["logos/*.svg", "usr/share/agent-center/logos/", "644"],
    ["logos/SOURCES.md", "usr/share/doc/agent-center/logo-sources.md", "644"],
    ["data/agent-center.desktop", "usr/share/applications/", "644"],
    ["data/agent-center-notify.desktop", "etc/xdg/autostart/", "644"],
    ["data/agent-center.sources", "usr/share/agent-center/", "644"],
    ["data/agent-center-archive-keyring.gpg", "usr/share/keyrings/", "644"],
    ["docs/logo.svg", "usr/share/icons/hicolor/scalable/apps/agent-center.svg", "644"],
    ["data/completions/agent-center.bash", "usr/share/bash-completion/completions/agent-center", "644"],
    ["data/completions/_agent-center", "usr/share/zsh/vendor-completions/", "644"],
    ["data/completions/agent-center.fish", "usr/share/fish/vendor_completions.d/", "644"],
    ["README.md", "usr/share/doc/agent-center/", "644"],
]
