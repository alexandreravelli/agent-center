name: Release

# Publishes a release whenever main carries a version (Cargo.toml) that has no release yet:
# merge the release pull request that release-plz opens (or bump `version` and add a
# CHANGELOG.md section by hand), and push to main. Every CI check runs first, and nothing is
# published if one fails.
# A commit message containing "[rebuild release]" rebuilds the files of the current release.
#
# The release files are also Agent Center's APT repository: the package points APT at
# https://github.com/<repo>/releases/latest/download/ (data/agent-center.sources), so the
# index (Packages, InRelease) is signed with the APT_SIGNING_KEY secret, whose public key is
# data/agent-center-archive-keyring.gpg (also attached to each release). The release is
# published once every file is uploaded.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.version.outputs.released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f 2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: check
    if: needs.check.outputs.released == 'false' || contains(github.event.head_commit.message, '[rebuild release]')
    uses: ./.github/workflows/ci.yml

  release:
    needs: [check, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Build on Debian 13 so the binary matches the target system's glibc.
    container: debian:trixie
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Install build tools
        run: |
          apt-get update
          # dpkg-dev provides dpkg-shlibdeps, which cargo-deb uses to fill in Depends.
          apt-get install -y --no-install-recommends ca-certificates curl gcc libc6-dev git dpkg-dev libgtk-3-dev pkgconf \
            apt-utils gpg gpg-agent
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - name: Import the APT signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          if [ -z "$APT_SIGNING_KEY" ]; then
            echo "::error::The APT_SIGNING_KEY secret is missing (see \"APT repository\" in README.md)."
            exit 1
          fi
          case "$APT_SIGNING_KEY" in
            *"BEGIN PGP PRIVATE KEY BLOCK"*) ;;
            *"BEGIN PGP PUBLIC KEY BLOCK"*)
              echo "::error::APT_SIGNING_KEY holds the public key; it needs the private key (gpg --armor --export-secret-keys)."
              exit 1 ;;
            *)
              echo "::error::APT_SIGNING_KEY is not an armored private key (-----BEGIN PGP PRIVATE KEY BLOCK-----)."
              exit 1 ;;
          esac
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          # Only gpg's own messages are reported: some of its lines quote the bad input.
          if ! out=$(printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import 2>&1); then
            why=$(printf '%s\n' "$out" | grep -E 'no valid OpenPGP data|failed:|agent' | head -n 2 | tr '\n' ' ')
            echo "::error::gpg cannot import APT_SIGNING_KEY: ${why:-unknown error}"
            exit 1
          fi
          have=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" {print $10; exit}')
          if [ -z "$have" ]; then
            echo "::error::APT_SIGNING_KEY holds no private key."
            exit 1
          fi
          # The package ships the public key APT trusts. Until the repository has a copy, it comes
          # from the secret; once it has one, the secret must match it.
          if [ -f data/agent-center-archive-keyring.gpg ]; then
            want=$(gpg --batch --with-colons --show-keys data/agent-center-archive-keyring.gpg | awk -F: '$1 == "fpr" {print $10; exit}')
            if [ "$want" != "$have" ]; then
              echo "::error::APT_SIGNING_KEY ($have) is not the key in data/agent-center-archive-keyring.gpg ($want)."
              exit 1
            fi
          else
            gpg --batch --export "$have" > data/agent-center-archive-keyring.gpg
          fi
          echo "Signing key: $have"
      - name: Build the Debian package
        run: |
          cargo build --locked --release
          cargo install cargo-deb --locked --version 3.8.0
          cargo deb --no-build
      - name: Sign the APT repository
        run: |
          # A flat repository whose files sit next to each other in the release ("download/" is the
          # last part of the URL, and the Suites value in agent-center.sources).
          mkdir -p apt/download
          cp target/debian/*.deb apt/download/
          cd apt
          apt-ftparchive packages download > download/Packages
          gzip -9kn download/Packages
          apt-ftparchive -o APT::FTPArchive::Release::Origin="Agent Center" \
            -o APT::FTPArchive::Release::Label="Agent Center" \
            -o APT::FTPArchive::Release::Suite=download release download > Release
          mv Release download/Release
          gpg --batch --clearsign -o download/InRelease download/Release
          gpg --batch --armor --detach-sign -o download/Release.gpg download/Release
      - name: Prepare release files
        run: |
          mkdir dist
          cp apt/download/* dist/
          # The same package under a name that does not change, for the install instructions.
          cp target/debian/*.deb dist/agent-center_amd64.deb
          cp data/agent-center-archive-keyring.gpg dist/
          tar czf "dist/agent-center-v${VERSION}-x86_64-linux.tar.gz" \
            -C target/release agent-center \
            -C "$GITHUB_WORKSPACE" README.md LICENSE Makefile catalog logos data debian docs/logo.svg
          (cd dist && sha256sum -- * > SHA256SUMS)
          # Release notes: this version's section of the changelog ("## [1.2.3] - date" or
          # "## [1.2.3](compare link) - date"), without the link definitions at the end.
          awk -v v="[$VERSION]" 'index($0, "## " v) == 1 {on=1; next} /^## / {on=0} /^\[.*\]: / {next} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Agent Center v${{ env.VERSION }}
          body_path: notes.md
          files: dist/*
          # Published by the next job, once every file is there: APT reads the latest release.
          draft: true

  publish:
    needs: [check, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v${{ needs.check.outputs.version }}" --draft=false --latest --repo "$GITHUB_REPOSITORY"
